server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Soporte optimizado para streaming de videos
    location ~* \.(mp4|webm)$ {
        root /usr/share/nginx/html;
        mp4;
        mp4_buffer_size 1m;
        mp4_max_buffer_size 5m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}