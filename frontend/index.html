<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Skills FC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .text-fc { color: #00ff87; } /* Verde Neón */
        .bg-fc { background-color: #00ff87; color: #0f172a; }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen">

<!-- Encabezado / Header -->
<header class="bg-slate-950 border-b border-slate-800 p-6 text-center shadow-2xl">
    <h1 class="text-4xl md:text-5xl font-black uppercase tracking-wider text-white">
        🎮 <span class="text-fc">Meta</span> Skills
    </h1>
    <p class="text-slate-400 mt-2 font-medium tracking-wide">El catálogo definitivo para dominar la cancha</p>
</header>

<!-- Contenido Principal -->
<main class="container mx-auto px-4 py-10">

    <!-- Barra de Búsqueda -->
    <div class="max-w-md mx-auto mb-8 relative">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
            <span>🔍</span>
        </div>
        <input type="text" id="buscador" oninput="filtrarSkills()"
               class="w-full bg-slate-800/50 border border-slate-700 text-white rounded-full py-3 pl-12 pr-4 focus:outline-none focus:border-fc focus:ring-1 focus:ring-fc transition-all shadow-lg placeholder-slate-500"
               placeholder="Buscar skill (ej. Ruleta, Elástica...)">
    </div>

    <div id="filtros" class="mb-10 flex flex-wrap justify-center gap-3">
        <button class="bg-fc font-bold py-2 px-6 rounded-full transition-transform hover:scale-105 shadow-[0_0_15px_rgba(0,255,135,0.3)]">Todas</button>
        <button class="bg-slate-800 border border-slate-700 text-slate-300 font-bold py-2 px-6 rounded-full hover:bg-slate-700 transition-colors">En la banda</button>
        <button class="bg-slate-800 border border-slate-700 text-slate-300 font-bold py-2 px-6 rounded-full hover:bg-slate-700 transition-colors">Dentro del área</button>
    </div>

    <!-- Grilla de Tarjetas (Se adapta a 1, 2, 3 o 4 columnas según la pantalla) -->
    <div id="contenedor-skills" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        <p class="text-center col-span-full text-slate-400 animate-pulse">Conectando con el servidor...</p>
    </div>
</main>

<!-- Modal de Video (Modo Cine) -->
<div id="video-modal" class="hidden fixed inset-0 z-50 bg-black/95 flex-col items-center justify-center p-4 transition-opacity duration-300 opacity-0">
    <!-- Botón de cerrar -->
    <button onclick="cerrarModal()" class="absolute top-6 right-6 text-slate-400 hover:text-fc text-5xl font-bold cursor-pointer transition-colors">&times;</button>

    <!-- Título -->
    <h3 id="modal-titulo" class="text-2xl md:text-4xl font-black text-white uppercase tracking-wider mb-4 text-center shadow-black drop-shadow-lg"></h3>
    <p id="modal-escenario" class="text-slate-300 text-sm md:text-base italic mb-4 max-w-3xl text-center leading-relaxed px-4"></p>

    <!-- Contenedor del Comando en pantalla grande -->
    <div id="modal-comando-contenedor" class="mb-6 bg-slate-900/80 rounded-xl p-4 text-center border border-slate-700/50 min-w-[300px]">
        <p class="text-[12px] text-slate-400 mb-2 uppercase tracking-widest font-bold">Ejecución</p>
        <div id="modal-comando" class="flex flex-wrap justify-center items-center mt-2">
            <!-- Acá JavaScript inyecta los botones -->
        </div>
    </div>

    <!-- Reproductor grande -->
    <div class="w-full max-w-4xl bg-slate-900 rounded-xl overflow-hidden shadow-[0_0_40px_rgba(0,255,135,0.15)] border border-slate-700 relative">
        <video id="modal-video" controls autoplay loop playsinline class="w-full aspect-video object-cover"></video>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
